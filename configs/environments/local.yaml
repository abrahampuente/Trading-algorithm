environment: local
app_name: algo-trading
log_level: INFO

initial_capital: 100000.00
max_positions: 5

# Parámetros por defecto de la estrategia v1 (bloqueados tras el
# walk-forward sobre el universo diversificado; ver docs/project-status.md).
strategy:
  risk_per_trade: 0.01            # 1,0 % del equity por operación
  stop_loss_atr_multiple: 2.0     # SL = entrada - 2 x ATR
  take_profit_atr_multiple: 3.0   # TP = entrada + 3 x ATR
  max_position_exposure: 0.20     # 20 % del equity por posición

# Universo por defecto de algo-ingest y algo-backtest.
default_universe: diversified

database:
  host: localhost
  port: 3306
  name: algo_trading
  user: algo_trading_app

# Perfiles de costes por ejecución (fracción: 0.0005 = 0,05 %).
cost_profiles:
  optimista:
    commission_rate: 0.0002
    slippage_rate: 0.0002
  base:
    commission_rate: 0.0005
    slippage_rate: 0.0005
  conservador:
    commission_rate: 0.0010
    slippage_rate: 0.0010

# Universos de símbolos (--universe en algo-ingest y algo-backtest).
universes:
  initial: [AAPL, MSFT, GOOGL, SPY, QQQ]
  diversified:
    # Tecnología e índices
    - AAPL
    - MSFT
    - GOOGL
    - QQQ
    - SPY
    # Energía, finanzas, salud, consumo e industria
    - XOM
    - JPM
    - JNJ
    - PG
    - CAT
    # Oro y bonos del Tesoro largos
    - GLD
    - TLT
    # ETFs sectoriales
    - XLE
    - XLF
    - XLV
  # Series de referencia de la v2 (no operables): benchmarks, VIX y los 11
  # ETFs sectoriales SPDR. Alimentan los filtros de régimen de signals/.
  macro_benchmarks:
    - SPY
    - QQQ
    - "^VIX"
    - XLK
    - XLF
    - XLV
    - XLE
    - XLY
    - XLP
    - XLI
    - XLC
    - XLU
    - XLB
    - XLRE

# Proveedor intradía v2 (Hito 2). Credenciales en .env: ALPACA_API_KEY_ID y
# ALPACA_API_SECRET_KEY. Se usa con algo-backtest --intrabar-resolution.
intraday:
  provider: alpaca
  feed: iex                  # iex (gratuito, volumen parcial) o sip
  data_url: https://data.alpaca.markets
  timeout_seconds: 30
  max_attempts: 5            # reintentos con backoff exponencial
  base_delay_seconds: 1
  max_delay_seconds: 60
  price_tolerance: 0.01      # margen sobre el rango diario antes del fallback

# Broker de paper trading v2 (Hito 3). Sólo Alpaca Paper: además de esta URL,
# ALPACA_PAPER=true es obligatorio en .env antes de enviar cualquier orden.
broker:
  name: alpaca
  environment: paper
  base_url: https://paper-api.alpaca.markets
  timeout_seconds: 30
  max_attempts: 3
  gap_threshold_atr: 0.5       # límite de la compra OPG: Close + 0.5 x ATR

# Filtros de régimen v2 (desactivados por defecto; se activan desde la CLI con
# --use-sector-relative-strength y --vix-filter-threshold).
signals:
  reference_universe: macro_benchmarks
  benchmark: SPY
  vix_symbol: "^VIX"
  relative_strength_lookback: 63   # sesiones (≈3 meses)
  sector_top_k: 4                  # sectores más fuertes admitidos
  sector_allow_unmapped: true      # SPY, GLD, TLT no son apuestas sectoriales
  sector_etfs:
    technology: XLK
    financials: XLF
    health_care: XLV
    energy: XLE
    consumer_discretionary: XLY
    consumer_staples: XLP
    industrials: XLI
    communication_services: XLC
    utilities: XLU
    materials: XLB
    real_estate: XLRE
  sector_map:
    AAPL: technology
    MSFT: technology
    GOOGL: communication_services
    QQQ: technology
    XOM: energy
    JPM: financials
    JNJ: health_care
    PG: consumer_staples
    CAT: industrials
    XLE: energy
    XLF: financials
    XLV: health_care
