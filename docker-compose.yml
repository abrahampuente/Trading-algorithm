services:
  mysql:
    image: mysql:8.0
    container_name: algo-trading-mysql
    restart: unless-stopped
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root-dev-password
      MYSQL_DATABASE: algo_trading
      MYSQL_USER: algo_trading_app
      MYSQL_PASSWORD: algo-trading-dev-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "algo_trading_app",
          "-palgo-trading-dev-password",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
